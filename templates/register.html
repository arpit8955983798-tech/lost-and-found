<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - LostLink</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* MAIN PAGE */

        .register-page {
            min-height: 100vh;
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;

    background:
    linear-gradient(
       rgba(5, 20, 45, 0.30),
        rgba(5, 20, 45, 0.35)
    ),
    url("{{ url_for('static', filename='images/college.jpg/college.jpg') }}");

background-size: cover;
background-position: center;
background-repeat: no-repeat;
background-attachment: fixed;

        /* BLUE GLOW */

        .register-page::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;

            background: rgba(0, 200, 255, 0.20);

            filter: blur(100px);
            border-radius: 50%;

            top: -150px;
            right: -150px;

            animation: glow 5s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.3);
            }
        }

        /* LOGO */

        .register-logo {
    position: absolute;
    top: 25px;
    right: 30px;

    width: 85px;
    height: 85px;

    object-fit: contain;

    background: white;
    padding: 8px;

    border-radius: 15px;

    box-shadow: 0 0 25px rgba(0, 220, 255, 0.5);

    animation: logoFloat 3s ease-in-out infinite;
}

        @keyframes logoFloat {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        /* CONTAINER */

        .register-container {
            position: relative;
            z-index: 2;

            width: 100%;
            max-width: 1050px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 70px;
        }

        /* LEFT SIDE */

        .register-left {
            flex: 1;
            color: white;

            animation: leftAnimation 1s ease;
        }

        @keyframes leftAnimation {

            from {
                opacity: 0;
                transform: translateX(-60px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .register-left h1 {
            font-size: 60px;
            line-height: 1.05;

            margin-bottom: 20px;

            color: white;

            text-shadow:
                0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .register-left h1 span {
            color: #00e5ff;
        }

        .register-left h2 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .register-left p {
            font-size: 17px;
            line-height: 1.7;

            max-width: 480px;

            color: #e6f8ff;
        }

        /* ANIMATED BAG */

        .bag-animation {
            margin-top: 45px;

            width: 150px;
            height: 130px;

            position: relative;

            animation: bagFloat 3s ease-in-out infinite;
        }

        @keyframes bagFloat {

            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-15px) rotate(-3deg);
            }
        }

        .bag {
            position: absolute;

            width: 105px;
            height: 80px;

            background: linear-gradient(
                145deg,
                #8b4513,
                #4e210b
            );

            border-radius: 8px;

            bottom: 5px;
            left: 20px;

            box-shadow:
                0 15px 25px rgba(0,0,0,0.4);
        }

        .bag::before {
            content: "";

            position: absolute;

            width: 45px;
            height: 25px;

            border: 7px solid #5b2a0b;
            border-bottom: none;

            border-radius: 30px 30px 0 0;

            top: -25px;
            left: 23px;
        }

        .bag::after {
            content: "🔑";

            position: absolute;

            font-size: 22px;

            top: 28px;
            left: 39px;
        }

        /* REGISTER CARD */

        .register-card {
            width: 430px;

            padding: 38px;

            background: rgba(255,255,255,0.95);

            border-radius: 25px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.35);

                backdrop-filter: blur(15px);

            animation: cardAnimation 1s ease;
        }

        @keyframes cardAnimation {

            from {
                opacity: 0;
                transform: translateX(60px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        .register-card h1 {
            text-align: center;

            font-size: 32px;

            color: #102a56;

            margin-bottom: 8px;
        }

        .register-subtitle {
            text-align: center;

            color: #687386;

            margin-bottom: 28px;

            font-size: 14px;
        }

        /* INPUT GROUP */

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;
            font-weight: 600;

            color: #253858;
        }

        .input-box {
            position: relative;
        }

        .input-box span {
            position: absolute;

            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 19px;

            z-index: 2;
        }

        .input-box input {
            width: 100%;

            padding: 14px 15px 14px 48px;

            border: 2px solid #dce3ec;

            border-radius: 12px;

            outline: none;

            font-size: 15px;

            color: #222;

            background: #fff;

            transition: 0.3s;
        }

        .input-box input:focus {
            border-color: #00bcd4;

            box-shadow:
                0 0 0 4px rgba(0,188,212,0.12);

            transform: translateY(-2px);
        }

        .input-box input::placeholder {
            color: #9ba6b5;
        }

        /* BUTTON */

        .register-btn {
            width: 100%;

            padding: 14px;

            margin-top: 8px;

            border: none;
            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #00bcd4,
                    #006eff
                );

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 8px 20px rgba(0,126,255,0.25);
        }

        .register-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 25px rgba(0,126,255,0.35);
        }

        .register-btn:active {
            transform: scale(0.98);
        }

        /* LOGIN LINK */

        .login-link {
            text-align: center;

            margin-top: 22px;

            color: #667085;

            font-size: 14px;
        }

        .login-link a {
            color: #007bff;

            font-weight: bold;

            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* MOBILE */

        @media (max-width: 800px) {

            .register-page {
                padding: 100px 18px 40px;

                background-attachment: scroll;
            }

            .register-container {
                flex-direction: column;

                gap: 30px;
            }

            .register-left {
                text-align: center;
            }

            .register-left h1 {
                font-size: 42px;
            }

            .register-left h2 {
                font-size: 23px;
            }

            .register-left p {
                font-size: 15px;
            }

            .bag-animation {
                margin: 25px auto 0;
            }

            .register-card {
                width: 100%;

                max-width: 430px;

                padding: 28px 22px;
            }

            .register-logo {
                width: 60px;
                height: 60px;

                top: 20px;
                right: 20px;
            }
        }

        /* SMALL MOBILE */

        @media (max-width: 450px) {

            .register-page {
                padding-left: 12px;
                padding-right: 12px;
            }

            .register-left h1 {
                font-size: 34px;
            }

            .register-left h2 {
                font-size: 20px;
            }

            .register-card {
                padding: 25px 18px;

                border-radius: 20px;
            }

            .register-card h1 {
                font-size: 27px;
            }
        }
    /* ===== BAG INTRO ANIMATION ===== */

.intro-animation {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    pointer-events: none;
    overflow: hidden;
    animation: introHide 0.8s ease 4.5s forwards;
}

.intro-animation img {
    width: 260px;
    max-width: 35vw;
    position: absolute;
    left: -300px;
    bottom: 8%;
    animation: manWalk 4s ease-in-out forwards;
}

@keyframes manWalk {
    0% {
        left: -300px;
        transform: scale(0.9);
    }

    60% {
        left: 35%;
        transform: scale(1);
    }

    100% {
        left: 42%;
        transform: scale(1);
    }
}

@keyframes introHide {
    to {
        opacity: 0;
        visibility: hidden;
    }
}

/* Registration form initially hidden */

.register-container {
    opacity: 0;
    visibility: hidden;
    transform: translateY(30px) scale(0.96);
    animation: showRegister 1s ease 4.6s forwards;
}

@keyframes showRegister {
    to {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
    }
}

/* Mobile */

@media (max-width: 600px) {
    .intro-animation img {
        width: 190px;
        bottom: 10%;
    }

    @keyframes manWalk {
        0% {
            left: -220px;
        }

        60% {
            left: 20%;
        }

        100% {
            left: 25%;
        }
    }
}
/* ===== FINAL REGISTER SHOW FIX ===== */

.register-container {
    opacity: 0 !important;
    visibility: hidden !important;
    transform: translateY(30px) scale(0.96);
}

.register-container.show-register {
    opacity: 1 !important;
    visibility: visible !important;
    transform: translateY(0) scale(1);
    transition: all 0.8s ease;
}

.intro-animation {
    z-index: 9999;
}
@keyframes movingMan {
    0% {
        left: -220px;
    }

    50% {
        left: 50%;
        transform: translateX(-50%);
    }

    100% {
        left: calc(100% + 20px);
        transform: translateX(0);
    }
}
#movingMan {
    position: fixed;
    left: -220px;
    bottom: 50px;
    width: 180px;
    z-index: 9999999;
    pointer-events: none;
    display: block;
    animation: movingManAnimation 8s linear infinite;
}

#movingMan img {
    width: 180px;
    height: auto;
    display: block;
}

@keyframes movingManAnimation {
    0% {
        left: -220px;
    }

    50% {
        left: 50%;
        transform: translateX(-50%);
    }

    100% {
        left: calc(100% + 20px);
        transform: translateX(0);
    }
}

    </style>
</head>


<body class="register-page">
<style>
#bagManDirect {
    position: fixed;
    width: 180px;
    height: auto;
    bottom: 40px;
    left: -200px;
    z-index: 99999999;
    display: block;
    opacity: 1;
    visibility: visible;
    animation: bagRun 8s linear infinite;
}

@keyframes bagRun {
    0% {
        left: -200px;
    }

    50% {
        left: 50%;
        transform: translateX(-50%);
    }

    100% {
        left: calc(100% + 20px);
        transform: translateX(0);
    }
}
</style>

<img
    id="bagManDirect"
    src="{{ url_for('static', filename='images/bag-man.png') }}"
    alt="Moving Man"
>

    <!-- MUJ LOGO -->

 <img
    class="register-logo"
    src="/muj-logo"
    alt="MUJ Logo"
>

    <div class="register-container">

        <!-- LEFT SIDE -->

        <div class="register-left">

            <h1>
                Lost<span>Link</span>
            </h1>

            <h2>
                Find it. Report it. Return it.
            </h2>

            <p>
                Create your account and become a part of
                our campus Lost & Found community.
                Help lost belongings find their way home.
            </p>


            <!-- BAG ANIMATION -->

            <div class="bag-animation">

                <div class="bag"></div>

            </div>

        </div>


        <!-- REGISTER CARD -->

        <div class="register-card">

            <h1>Create Account</h1>

            <p class="register-subtitle">
                Join the LostLink community
            </p>


            <form method="POST">

                <!-- USERNAME -->

                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-box">

                        <span>👤</span>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter username"
                            required
                        >

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-box">

                        <span>✉️</span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <span>🔒</span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="register-btn"
                >
                    Create Account
                </button>

            </form>


            <p class="login-link">

                Already have an account?

                <a href="{{ url_for('login') }}">
                    Sign In
                </a>

            </p>

        </div>

    </div>
    <script>
document.addEventListener("DOMContentLoaded", function () {
    setTimeout(function () {
        const animation = document.querySelector(".intro-animation");

        if (animation) {
            animation.style.display = "none";
        }
    }, 5500);
});
</script>
<script>
window.addEventListener("load", function () {

    setTimeout(function () {

        const registerBox = document.querySelector(".register-container");

        if (registerBox) {
            registerBox.classList.add("show-register");
        }

    }, 5000);

});
</script>
</body>
</html>
